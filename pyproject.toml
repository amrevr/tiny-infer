[project]
name = "tiny-infer"
version = "0.1.0"
description = "A from-scratch LLM inference engine, built to learn how inference works"
authors = [
    { name = "amrevr", email = "rijulrpi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.34",
    "safetensors>=0.6",
    "torch>=2.8",
    "transformers>=4.56",
]

[dependency-groups]
dev = ["pytest"]

# Inside the Linux container, use CPU-only torch wheels instead of pulling CUDA packages.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
